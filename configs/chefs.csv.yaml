name: chefs_catalog
description: "Chef's Catalog / QuickBook comma-delimited export"
type: csv
version: "1.0"
source_format: "Chef's Catalog CSV"

csv_options:
  delimiter: ","
  has_header: false
  encoding: "latin-1"

detection:
  filename_patterns:
    - "*chef*.csv"
  min_columns: 8
  content_patterns:
    - "^\\s*\\d{3,4}\\s*,\\s*1\\s*,"

fields:
  title:
    column_index: 5
  source:
    column_index: 6
  categories:
    columns:
      - {column_index: 2}
      - {column_index: 3}
      - {column_index: 4}
  ingredients:
    start_column_index: 7
    # An empty cell after the ingredients separates them from the instructions.
    cell_split_pattern: "\\s{3,}"   # side-by-side ingredients in one cell
  instructions:
    after_marker: ""
