# SPDX-License-Identifier: MIT
name: bbq_recipes
description: "XPath configuration for netRelief BBQ recipe archives"
version: "1.0"

detection:
  content_patterns:
    - "bbq.netrelief.com"
    - "Garry's Home Cookin'"

fields:
  title:
    xpath: "//font[@size='5']/b/text() | //p[@align='center']/font[@size='5']/b/text() | //title/text()"
  description:
    xpath: "//p/b[contains(., 'Recipe By')]/following-sibling::text()[1] | //p[b[contains(., 'Recipe By')]]/text()"
  yield_amount:
    xpath: "//p/b[contains(., 'Serving Size')]/following-sibling::text()[1] | //p[contains(., 'Makes')]/text()"
  ingredients:
    xpath: "(//table | //blockquote)//p[b and not(contains(b, 'Recipe By')) and not(contains(b, 'Serving Size'))]/b//text() | //p[b and not(contains(b, 'Recipe By')) and not(contains(b, 'Serving Size')) and not(font)]/b//text()"
    split_delimiter: "\n"
  instructions:
    xpath: "(//table | //blockquote)//p[preceding-sibling::p[b and not(contains(b, 'Recipe By')) and not(contains(b, 'Serving Size'))] and not(b) and not(contains(., 'Makes'))]/text() | //p[preceding-sibling::p[b and not(contains(b, 'Recipe By')) and not(contains(b, 'Serving Size'))] and not(b) and not(font) and not(contains(., 'Makes'))]/text()"
