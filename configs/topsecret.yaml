name: top_secret_recipes
description: XPath configuration for Todd Wilbur's Top Secret Recipes clone archive
version: '1.0'
detection:
  path_pattern: .*(?:Top Secret|topsecret).*\.htm[l]?$
  content_patterns:
  - Top Secret Recipes
  - Todd Wilbur
fields:
  title:
    xpath: //body//table//font[@size='5'] | //body//table//p[@align='center'] | //title/text()
  description:
    xpath: //p[@align='left'][1]//text()[not(contains(., 'From:')) and not(contains(.,
      'Makes')) and not(contains(., 'Serves')) and not(contains(., 'http'))] | //p[not(@align='center')][1]//text()[not(contains(.,
      'From:')) and not(contains(., 'Makes')) and not(contains(., 'Serves')) and not(contains(.,
      'http'))]
  yield_amount:
    xpath: "//body//text()[starts-with(normalize-space(translate(., '\_', ' ')), 'Makes\
      \ ') or starts-with(normalize-space(translate(., '\_', ' ')), 'Serves ') or\
      \ starts-with(normalize-space(translate(., '\_', ' ')), 'Yield ')]"
  ingredients:
    xpath: "//body//text()[(starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '1') or starts-with(normalize-space(translate(., '\_', ' ')), '2') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '3') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '4') or starts-with(normalize-space(translate(., '\_', ' ')), '5') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '6') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '7') or starts-with(normalize-space(translate(., '\_', ' ')), '8') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '9') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '1/') or starts-with(normalize-space(translate(., '\_', ' ')), '2/') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '3/') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ 'pinch') or starts-with(normalize-space(translate(., '\_', ' ')), 'dash')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'Nonstick') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'few drops') or starts-with(normalize-space(translate(., '\_\
      ', ' ')), 'ground') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ 'salt') or starts-with(normalize-space(translate(., '\_', ' ')), 'juice')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'shredded') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'whipped') or starts-with(normalize-space(translate(., '\_',\
      \ ' ')), 'whole') or starts-with(normalize-space(translate(., '\_', ' ')), 'boneless')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'skinless') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'fresh') or starts-with(normalize-space(translate(., '\_', '\
      \ ')), 'dry') or starts-with(normalize-space(translate(., '\_', ' ')), 'dried')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'sliced') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'chopped') or starts-with(normalize-space(translate(., '\_',\
      \ ' ')), 'diced') or starts-with(normalize-space(translate(., '\_', ' ')), 'melted')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'cooked') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'can ') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ 'package ') or starts-with(normalize-space(translate(., '\_', ' ')), 'pkg\
      \ ') or starts-with(normalize-space(translate(., '\_', ' ')), 'drop ') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'drops ') or starts-with(normalize-space(translate(., '\_', '\
      \ ')), 'splash ') or starts-with(normalize-space(translate(., '\_', ' ')), 'water')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'ice') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'egg') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ 'oil') or starts-with(normalize-space(translate(., '\_', ' ')), 'butter')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'flour') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'sugar') or starts-with(normalize-space(translate(., '\_', '\
      \ ')), 'milk')) and not(starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '1.')) and not(starts-with(normalize-space(translate(., '\_', ' ')), '2.'))\
      \ and not(starts-with(normalize-space(translate(., '\_', ' ')), '3.')) and not(starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '4.')) and not(starts-with(normalize-space(translate(., '\_',\
      \ ' ')), '5.')) and not(starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '6.')) and not(starts-with(normalize-space(translate(., '\_', ' ')), '7.'))\
      \ and not(starts-with(normalize-space(translate(., '\_', ' ')), '8.')) and not(starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '9.')) and not(starts-with(normalize-space(translate(., '\_',\
      \ ' ')), '10.')) and not(starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '11.')) and not(starts-with(normalize-space(translate(., '\_', ' ')), '12.'))\
      \ and not(contains(., 'Combine')) and not(contains(., 'Preheat')) and not(contains(.,\
      \ 'Place')) and not(contains(., 'Mix')) and not(contains(., 'Heat')) and not(contains(.,\
      \ 'In a')) and not(contains(., 'Copyright')) and not(contains(., 'Top Secret'))\
      \ and not(contains(., 'FrontPage')) and not(contains(., 'http')) and not(contains(.,\
      \ 'Back')) and not(contains(., 'Makes')) and not(contains(., 'Serves')) and\
      \ not(contains(., 'From:'))]"
  instructions:
    xpath: "//body//text()[(starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '1.') or starts-with(normalize-space(translate(., '\_', ' ')), '2.') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '3.') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '4.') or starts-with(normalize-space(translate(., '\_', ' ')), '5.') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '6.') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '7.') or starts-with(normalize-space(translate(., '\_', ' ')), '8.') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), '9.') or starts-with(normalize-space(translate(., '\_', ' ')),\
      \ '10.') or starts-with(normalize-space(translate(., '\_', ' ')), '11.') or\
      \ starts-with(normalize-space(translate(., '\_', ' ')), '12.') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'Combine') or starts-with(normalize-space(translate(., '\_',\
      \ ' ')), 'Mix') or starts-with(normalize-space(translate(., '\_', ' ')), 'Preheat')\
      \ or starts-with(normalize-space(translate(., '\_', ' ')), 'In a') or starts-with(normalize-space(translate(.,\
      \ '\_', ' ')), 'Place') or starts-with(normalize-space(translate(., '\_', '\
      \ ')), 'Pour') or starts-with(normalize-space(translate(., '\_', ' ')), 'Blend'))\
      \ and not(contains(., 'Copyright')) and not(contains(., 'From:')) and not(contains(.,\
      \ 'http')) and not(contains(., 'Top Secret')) and not(contains(., 'Makes'))\
      \ and not(contains(., 'Serves')) and not(contains(., 'Tidbits')) and not(contains(.,\
      \ 'Back'))]"
