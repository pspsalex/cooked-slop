<!DOCTYPE html>
<html>
<head><title>Garlic Butter Pasta</title></head>
<body>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Recipe",
  "name": "Garlic Butter Pasta",
  "recipeYield": "4 servings",
  "recipeCategory": "Pasta",
  "recipeIngredient": [
    "400g spaghetti",
    "4 cloves garlic, minced",
    "3 tablespoons butter",
    "2 tablespoons olive oil",
    "1/4 teaspoon red pepper flakes",
    "Salt and pepper to taste",
    "Fresh parsley, chopped"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToStep",
      "text": "Cook spaghetti according to package directions. Reserve 1 cup pasta water before draining."
    },
    {
      "@type": "HowToStep",
      "text": "In a large skillet, heat butter and olive oil over medium heat. Add garlic and red pepper flakes, cook for 1 minute."
    },
    {
      "@type": "HowToStep",
      "text": "Add drained pasta to the skillet. Toss with the garlic butter, adding pasta water as needed. Season with salt and pepper. Garnish with parsley."
    }
  ]
}
</script>
<h1>Garlic Butter Pasta</h1>
<p>A quick and easy weeknight dinner.</p>
</body>
</html>
